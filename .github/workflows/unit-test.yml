---
name: Unit Tests

defaults:
    run:
        shell: bash

on:
    push:
    pull_request:

jobs:
    test:
        name: Run unit tests
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  submodules: true
            - name: Install Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - name: Install Dependencies
              run: npm ci
            - name: Run tests
              run: npm test
